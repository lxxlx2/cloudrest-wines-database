name: Build Final Reviewed Report 2026-09-11

on:
  push:
    branches:
      - final-review-20260911

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - name: Install report and MySQL client dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-docx pillow
          sudo apt-get update
          sudo apt-get install -y default-mysql-client
          sudo mkdir -p /opt/homebrew/opt/mysql@8.4/bin
          sudo ln -sf /usr/bin/mysql /opt/homebrew/opt/mysql@8.4/bin/mysql

      - name: Rebuild portable SQL
        run: python tools/build_submission_sql.py

      - name: Refresh verification report against MySQL 8.4
        env:
          MYSQL_PWD: root
        run: python tools/verify_project.py

      - name: Build reviewed Word report
        run: python -c "from tools.build_word_reports import build_main; print(build_main())"

      - name: Commit refreshed verification data and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification/verification-report.json deliverables/final-submission/Cloudrest_Wines_Report.docx
          if git diff --cached --quiet; then
            echo "No report changes to commit"
          else
            git commit -m "build: refresh verified report after final review"
            git push origin HEAD:final-review-20260911
          fi
