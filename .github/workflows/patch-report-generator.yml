name: Patch Report Generator

on:
  push:
    branches:
      - final-review-20260911

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch generator and rebuild SQL deliverables
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/build_word_reports.py')
          s=p.read_text()
          replacements={
            "Mia | Zora | Rianna | 1":"Mia | Zora | Rianna | Jason",
            "('Schema and rules','1 / Zora','1'":"('Schema and rules','Jason / Zora','Jason'",
            "('Data dictionary','Zora / 1','Zora'":"('Data dictionary','Zora / Jason','Zora'",
            "('Official cleaning','1 / Mia','1'":"('Official cleaning','Jason / Mia','Jason'",
            "('Test data and integrity','1 / Rianna','1'":"('Test data and integrity','Jason / Rianna','Jason'",
            "('Six analytical queries','Rianna / 1','Rianna'":"('Six analytical queries','Rianna / Jason','Rianna'",
          }
          for a,b in replacements.items():
              s=s.replace(a,b)
          old="""    mapping={1:'t02_invalidroledate',2:'t03_missingreordercomment',3:'additional_postalshipment',4:'t04_unpaidshipment',5:'t05_overlappingsupervision'}\n    current=[]; active_rule=None\n"""
          new="""    task3b_sql=(ROOT/'database/tests/task3b_ruleviolations.sql').read_text(encoding='utf-8')\n    current=[]; active_rule=None\n"""
          s=s.replace(old,new)
          old="""    def add_rule_evidence(rule_no):\n        name=mapping[rule_no]\n        add_code(doc,(ROOT/'database/tests'/f'{name}.sql').read_text(encoding='utf-8'),'Readable SQL submitted for Turnitin')\n        add_note(doc,'Genuine evidence required',f'[PENDING STUDENT WORKBENCH SCREENSHOT — RULE {rule_no}] Capture readable SQL and the expected MySQL result under the submitting student account.')\n"""
          new="""    def add_rule_evidence(rule_no):\n        marker=f'-- Rule {rule_no}:'\n        start=task3b_sql.index(marker)\n        if rule_no < 5:\n            end=task3b_sql.index(f'-- Rule {rule_no+1}:', start)\n        else:\n            end=len(task3b_sql)\n        block=task3b_sql[start:end].strip()\n        add_code(doc,block,'Readable SQL submitted for Turnitin')\n        add_note(doc,'Genuine evidence required',f'[PENDING STUDENT WORKBENCH SCREENSHOT — RULE {rule_no}] Capture readable SQL and the expected MySQL result under the submitting student account.')\n"""
          s=s.replace(old,new)
          p.write_text(s)
          PY
          python tools/build_submission_sql.py
      - name: Commit patched generator and SQL deliverables if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/build_word_reports.py deliverables/final-submission/Cloudrest_Wines_Database.sql deliverables/final-submission/Cloudrest_Wines_Queries.sql deliverables/final-submission/Cloudrest_Wines_Rule_Violations.sql
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "build: sync reviewed report generator and SQL deliverables"
            git push origin HEAD:final-review-20260911
          fi
