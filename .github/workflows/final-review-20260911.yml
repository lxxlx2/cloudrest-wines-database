name: Final Review 2026-09-11

on:
  push:
    branches:
      - final-review-20260911

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - name: Build clean database
        shell: bash
        run: |
          set -euo pipefail
          cat database/schema/01_tables.sql database/schema/02_triggers.sql database/schema/03_reporting.sql database/data/01_testdata.sql \
            | docker exec -i ${{ job.services.mysql.id }} mysql -uroot -proot

      - name: Verify all six queries
        shell: bash
        run: |
          set -euo pipefail
          cid='${{ job.services.mysql.id }}'
          for f in database/queries/01_trainingcoverage.sql database/queries/02_incidentrate.sql database/queries/03_trainingimpact.sql database/queries/04_overtimerisk.sql database/queries/05_expiringqualification.sql database/queries/06_openactions.sql; do
            echo "RUN $f"
            docker exec -i "$cid" mysql -uroot -proot < "$f" >/tmp/out.txt
            test -s /tmp/out.txt
          done

      - name: Verify Query 2 edge visibility
        shell: bash
        run: |
          set -euo pipefail
          cid='${{ job.services.mysql.id }}'
          docker exec -i "$cid" mysql -uroot -proot cloudrestwines -e "INSERT INTO incident (incidentId,incidentDateTime,operationalAreaId,incidentType,severity,incidentDescription,totalLostHours,reportableFlag) VALUES ('INCD9999',NOW(),'AREA03','NEARMISS','LOW','QA edge case',0,FALSE);"
          docker exec -i "$cid" mysql -N -uroot -proot < database/queries/02_incidentrate.sql > /tmp/q2edge.txt
          grep -Fq $'Hospitality\t0.00\t1\t0.00\tNULL' /tmp/q2edge.txt

      - name: Verify Query 4 workforce coverage
        shell: bash
        run: |
          set -euo pipefail
          cid='${{ job.services.mysql.id }}'
          docker exec -i "$cid" mysql -N -uroot -proot < database/queries/04_overtimerisk.sql > /tmp/q4.txt
          test "$(wc -l < /tmp/q4.txt)" -eq 13
          grep -Fq $'EMP0001\tChristine Cloud\tAdministration\tOwner\t0.00\t0.00\t0\t0\tNO RECENT INDICATOR' /tmp/q4.txt

      - name: Verify Query 6 EXPLAIN
        shell: bash
        run: |
          set -euo pipefail
          cid='${{ job.services.mysql.id }}'
          docker exec -i "$cid" mysql -uroot -proot < database/queries/06_openactions.sql > /tmp/q6.txt
          grep -Fq 'idx_action_status_date' /tmp/q6.txt
          grep -Fq 'eq_ref' /tmp/q6.txt
          grep -Fq 'Using temporary; Using filesort' /tmp/q6.txt

      - name: Verify procedure and integrity edge cases
        shell: bash
        run: |
          set -euo pipefail
          cid='${{ job.services.mysql.id }}'
          expect_error() {
            sql="$1"; message="$2"
            set +e
            out=$(printf '%s\n' "$sql" | docker exec -i "$cid" mysql -uroot -proot cloudrestwines 2>&1)
            rc=$?
            set -e
            printf '%s\n' "$out"
            test "$rc" -ne 0
            printf '%s\n' "$out" | grep -Fq "$message"
          }
          expect_error "CALL getExpiringQualifications(NULL);" "daysAhead must be a non-NULL value between 0 and 730"
          expect_error "INSERT INTO address VALUES ('ADDR9998','POSTAL',NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,'Richmond','VIC','3121');" "chk_address_postaltype_required"
          docker exec -i "$cid" mysql -uroot -proot cloudrestwines -e "INSERT INTO customerorder VALUES ('CORD9997','CUST001',CURRENT_DATE,TRUE,'CANCELLED');"
          expect_error "INSERT INTO shipment VALUES ('SHIP9997','CORD9997','ADDR0003',CURRENT_DATE);" "Cancelled order cannot be shipped"
          docker exec -i "$cid" mysql -uroot -proot cloudrestwines -e "INSERT INTO customerorder VALUES ('CORD9996','CUST001',CURRENT_DATE,TRUE,'PENDING');"
          expect_error "INSERT INTO shipment VALUES ('SHIP9996','CORD9996','ADDR0003',DATE_SUB(CURRENT_DATE,INTERVAL 1 DAY));" "Shipment date cannot precede order received date"

      - name: Verify five assessed rules
        shell: bash
        run: |
          set -euo pipefail
          cid='${{ job.services.mysql.id }}'
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('database/tests/task3b_ruleviolations.sql').read_text()
          parts=re.split(r'(?=-- ={10,}\n-- Rule [1-5]:)', text)
          for part in parts:
              m=re.search(r'-- Rule ([1-5]):', part)
              if m:
                  Path(f'/tmp/rule{m.group(1)}.sql').write_text('USE cloudrestwines;\n'+part)
          PY
          run_rule() {
            n="$1"; code="$2"; message="$3"
            set +e
            out=$(docker exec -i "$cid" mysql -uroot -proot < "/tmp/rule${n}.sql" 2>&1)
            rc=$?
            set -e
            printf '%s\n' "$out"
            test "$rc" -ne 0
            printf '%s\n' "$out" | grep -Fq "$code"
            printf '%s\n' "$out" | grep -Fq "$message"
          }
          run_rule 1 "ERROR 3819" "chk_employeerole_dates"
          run_rule 2 "ERROR 3819" "chk_bottletype_reorder"
          run_rule 3 "ERROR 1644" "Shipment address must be a physical address, not PO Box or Private Bag"
          run_rule 4 "ERROR 1644" "Order must be paid before shipment"
          run_rule 5 "ERROR 1644" "Employee already has a supervisor during this period"

      - name: Build portable SQL deliverables
        run: python tools/build_submission_sql.py

      - name: Upload SQL deliverables
        uses: actions/upload-artifact@v4
        with:
          name: cloudrest-final-sql
          path: |
            deliverables/final-submission/Cloudrest_Wines_Database.sql
            deliverables/final-submission/Cloudrest_Wines_Queries.sql
            deliverables/final-submission/Cloudrest_Wines_Rule_Violations.sql
