name: QA review fixes

on:
  push:
    branches:
      - qa/review-fixes-20260911

jobs:
  qa:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - name: Build clean database
        shell: bash
        run: |
          set -euo pipefail
          cat database/schema/01_tables.sql database/schema/02_triggers.sql database/schema/03_reporting.sql database/data/01_testdata.sql \
            | docker exec -i ${{ job.services.mysql.id }} mysql -uroot -proot

      - name: Run Queries 2, 4 and 6
        shell: bash
        run: |
          set -euo pipefail
          cid='${{ job.services.mysql.id }}'
          docker exec -i "$cid" mysql -uroot -proot < database/queries/02_incidentrate.sql | tee /tmp/q2.txt
          docker exec -i "$cid" mysql -uroot -proot < database/queries/04_overtimerisk.sql | tee /tmp/q4.txt
          docker exec -i "$cid" mysql -uroot -proot < database/queries/06_openactions.sql | tee /tmp/q6.txt
          grep -Fq 'Vineyard' /tmp/q2.txt
          grep -Fq 'Cellar' /tmp/q2.txt
          grep -Fq 'employeeId' /tmp/q4.txt
          grep -Fq 'EMP0006' /tmp/q4.txt
          grep -Fq 'idx_action_status_date' /tmp/q6.txt
          grep -Fq $'ca\tNULL\trange' /tmp/q6.txt
          grep -Fq $'i\tNULL\teq_ref' /tmp/q6.txt

      - name: Verify Query 2 retains incident-only area
        shell: bash
        run: |
          set -euo pipefail
          cid='${{ job.services.mysql.id }}'
          docker exec -i "$cid" mysql -uroot -proot <<'SQL'
          USE cloudrestwines;
          INSERT INTO incident
            (incidentId, incidentDateTime, operationalAreaId, incidentType, severity, incidentDescription, totalLostHours, reportableFlag)
          VALUES
            ('INCD0999', NOW(), 'AREA03', 'NEARMISS', 'LOW', 'QA incident without recorded labour hours', 0, FALSE);
          SQL
          docker exec -i "$cid" mysql -uroot -proot < database/queries/02_incidentrate.sql | tee /tmp/q2_edge.txt
          grep -Fq 'Hospitality' /tmp/q2_edge.txt
          docker exec -i "$cid" mysql -uroot -proot -e "USE cloudrestwines; DELETE FROM incident WHERE incidentId='INCD0999';"

      - name: Verify procedure NULL and edge integrity controls
        shell: bash
        run: |
          set -euo pipefail
          cid='${{ job.services.mysql.id }}'
          expect_error() {
            label="$1"; needle="$2"; sql="$3"
            set +e
            out=$(printf '%s\n' "$sql" | docker exec -i "$cid" mysql -uroot -proot 2>&1)
            rc=$?
            set -e
            printf '%s: %s\n' "$label" "$out"
            test "$rc" -ne 0
            printf '%s\n' "$out" | grep -Fq "$needle"
          }
          expect_error NULL_HORIZON 'daysAhead must be a non-NULL value between 0 and 730' "USE cloudrestwines; CALL getExpiringQualifications(NULL);"
          expect_error POSTAL_TYPE 'chk_address_postaltype_required' "USE cloudrestwines; INSERT INTO address VALUES ('ADDR0999','POSTAL',NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,'Test','VIC','3000');"
          expect_error CANCELLED_SHIPMENT 'Cancelled order cannot be shipped' "USE cloudrestwines; INSERT INTO customerorder VALUES ('CORD0997','CUST001',CURRENT_DATE,TRUE,'CANCELLED'); INSERT INTO shipment VALUES ('SHIP0997','CORD0997','ADDR0003',CURRENT_DATE);"
          docker exec -i "$cid" mysql -uroot -proot -e "USE cloudrestwines; DELETE FROM customerorder WHERE customerOrderId='CORD0997';"
          expect_error EARLY_SHIPMENT 'Shipment date cannot precede order received date' "USE cloudrestwines; INSERT INTO customerorder VALUES ('CORD0996','CUST001',CURRENT_DATE,TRUE,'PENDING'); INSERT INTO shipment VALUES ('SHIP0996','CORD0996','ADDR0003',DATE_SUB(CURRENT_DATE,INTERVAL 1 DAY));"
          docker exec -i "$cid" mysql -uroot -proot -e "USE cloudrestwines; DELETE FROM customerorder WHERE customerOrderId='CORD0996';"

      - name: Verify assessed Rule 1 to Rule 5 outcomes and rollback cleanup
        shell: bash
        run: |
          set -euo pipefail
          cid='${{ job.services.mysql.id }}'
          set +e
          out=$(docker exec -i "$cid" mysql --force -uroot -proot < database/tests/task3b_ruleviolations.sql 2>&1)
          set -e
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -Fq "chk_employeerole_dates"
          printf '%s\n' "$out" | grep -Fq "chk_bottletype_reorder"
          printf '%s\n' "$out" | grep -Fq "Shipment address must be a physical address"
          printf '%s\n' "$out" | grep -Fq "Order must be paid before shipment"
          printf '%s\n' "$out" | grep -Fq "Employee already has a supervisor during this period"
          test "$(docker exec -i "$cid" mysql -N -uroot -proot -e "USE cloudrestwines; SELECT COUNT(*) FROM employee WHERE employeeId='EMP9999';")" = "0"
          test "$(docker exec -i "$cid" mysql -N -uroot -proot -e "USE cloudrestwines; SELECT COUNT(*) FROM customerorder WHERE customerOrderId='CORD0998';")" = "0"
          test "$(docker exec -i "$cid" mysql -N -uroot -proot -e "USE cloudrestwines; SELECT COUNT(*) FROM bottletype WHERE bottleTypeId='BOTL099';")" = "0"

      - name: Reconcile incident lost-hour summary
        shell: bash
        run: |
          set -euo pipefail
          cid='${{ job.services.mysql.id }}'
          mismatches=$(docker exec -i "$cid" mysql -N -uroot -proot -e "USE cloudrestwines; SELECT COUNT(*) FROM incident i LEFT JOIN (SELECT incidentId,SUM(employeeLostHours) employeeHours FROM incidentemployee GROUP BY incidentId) x ON x.incidentId=i.incidentId WHERE i.totalLostHours <> COALESCE(x.employeeHours,0);" )
          echo "lost-hour mismatches=$mismatches"
          test "$mismatches" = "0"
